apiVersion: monitoring.egarciam.com/v1alpha1
kind: CertificateMonitor
metadata:
  labels:
    app.kubernetes.io/name: certificatemonitor
    app.kubernetes.io/instance: certificatemonitor-sample
    app.kubernetes.io/part-of: check-certs
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: check-certs
  name: certificatemonitor-sample
spec:
  discoverInternal: true
  discoverExternal: false
  sendMail: true
  checkInterval: 3600
  emailCooldown: 86400
  expiryThresholdDays: 30
  # Recipients ConfigMap. The namespace defaults to the namespace of this
  # CertificateMonitor, and the name defaults to email-recipients-config.
  emailRecipientsConfigMap: email-recipients-config
  emailRecipientsNamespace: default
  # SMTP overrides. Unset fields fall back to the manager defaults
  # (--smtp-host, --smtp-port, --smtp-from).
  smtpHost: mailhog-service
  smtpPort: 1025
  smtpFrom: no-reply@example.com
  # Optional credentials Secret with "username" and "password" keys.
  # smtpCredentialsSecret: smtp-auth
  # smtpCredentialsNamespace: default
  # smtpTls: false
